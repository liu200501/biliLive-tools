name: Release Build (Windows Electron)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如 v1.2.3)'
        required: true
        type: string
      release_name:
        description: 'Release 标题（留空则用 tag）'
        required: false
        type: string
      release_body:
        description: 'Release 描述（支持 Markdown，可多行）'
        required: false
        type: string
      prerelease:
        description: '是否为预发布？'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    tags:
      - "*"

jobs:
  build_and_release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # 如果通过 push tag 触发，使用 ref_name；如果手动触发，使用输入的 tag
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    strategy:
      matrix:
        os: [windows-2022]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/pnpm-lock.yaml')) }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Cache Electron-Builder
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/pnpm-lock.yaml')) }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-cache-

      - name: Install binary deps
        run: pnpm run install:bin

      - name: Build
        run: pnpm run build:app

      - name: Rename artifacts
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $dist = "packages/app/dist"
          Get-ChildItem "$dist/*.exe" | ForEach-Object {
            Rename-Item -Path $_.FullName -NewName "biliLive-tools-$tag-win-x64.exe"
          }
          Get-ChildItem "$dist/*.zip" | ForEach-Object {
            Rename-Item -Path $_.FullName -NewName "biliLive-tools-$tag-win-x64.zip"
          }
          Get-ChildItem $dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ inputs.release_name || env.RELEASE_TAG }}
          body: ${{ inputs.release_body }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          # 如果已经是打好的 tag，防止覆盖原有的草稿状态
          draft: false
          files: |
            packages/app/dist/biliLive-tools-${{ env.RELEASE_TAG }}-win-x64.exe
            packages/app/dist/biliLive-tools-${{ env.RELEASE_TAG }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
